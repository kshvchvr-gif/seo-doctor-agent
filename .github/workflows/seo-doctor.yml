name: SEO Doctor Weekly

on:
  schedule:
    # Every Sunday 3:00 AM UTC = ~8:30 AM IST
    - cron: "0 3 * * 0"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  run-seo-doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: seo-embed-cache-${{ github.run_id }}
          restore-keys: |
            seo-embed-cache-

      - name: Run SEO Doctor
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
        run: python -m src.main

      - name: Commit report only (cache is NOT committed, avoids repo bloat)
        run: |
          git config user.name "seo-doctor-bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "SEO Doctor report $(date +%F)"
          git push

      - name: Publish rolling SEO Doctor issue (dedup, no weekly spam)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const LABEL = 'seo-report';
            const ROLLING_TITLE = 'SEO Doctor Report — Latest';
            const body = fs.readFileSync('reports/latest.md', 'utf8').slice(0, 65000);

            // All currently-open report issues (normal issues only, not PRs).
            const openIssues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            })).filter(i => !i.pull_request);

            const rolling = openIssues.find(i => i.title === ROLLING_TITLE);

            if (rolling) {
              await github.rest.issues.update({
                owner, repo, issue_number: rolling.number, body,
              });
              console.log(`Updated rolling issue #${rolling.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: ROLLING_TITLE, body, labels: [LABEL],
              });
              console.log(`Created rolling issue #${created.data.number}`);
            }

            // Close any older, per-date report issues so only the rolling one stays open.
            for (const issue of openIssues) {
              if (issue.title === ROLLING_TITLE) continue;
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              console.log(`Closed stale report issue #${issue.number} (${issue.title})`);
            }
